name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work

jobs:
  docs-validation:
    name: Validate product/testing docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run documentation tests
        run: bash scripts/test_docs.sh
